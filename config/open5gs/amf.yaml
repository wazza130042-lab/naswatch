# Open5GS AMF Configuration for NASWatch 5G Testbed
logger:
  file:
    path: /home/megbaru/open5gs/install/var/log/open5gs/amf.log
  level: info

amf:
  sbi:
    server:
      - address: 127.0.0.5
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777
  ngap:
    server:
      - address: 127.0.0.5
  guami:
    - plmn_id:
        mcc: 999
        mnc: 70
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 999
        mnc: 70
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 999
        mnc: 70
      s_nssai:
        - sst: 1
          sd: 000001
        - sst: 2
          sd: 000002
        - sst: 3
          sd: 000003
        - sst: 4
          sd: "010203"
  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    # Test-lab setting: leave NAS payloads visible to the passive PCAP parser.
    # Do not copy this null-cipher preference into a production network.
    ciphering_order: [ NEA0, NEA2, NEA1 ]
  network_name:
    full: "Open5GS-Lab-5G"
    short: "5G-Lab"
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
