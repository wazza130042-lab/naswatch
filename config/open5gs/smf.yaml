# Open5GS SMF Configuration for NASWatch 5G Testbed
logger:
  file:
    path: /home/megbaru/open5gs/install/var/log/open5gs/smf.log
  level: info

smf:
  sbi:
    server:
      - address: 127.0.0.4
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777
  pfcp:
    server:
      - address: 127.0.0.4
    client:
      upf:
        - address: 127.0.0.7
  gtpu:
    server:
      - address: 127.0.0.4
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
  dns:
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400
  info:
    s_nssai:
      - sst: 1
        sd: 000001
        dnn:
          - internet
      - sst: 2
        sd: 000002
        dnn:
          - internet
      - sst: 3
        sd: 000003
        dnn:
          - internet
      - sst: 4
        sd: "010203"
        dnn:
          - internet
