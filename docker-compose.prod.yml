# NASWatch — Production Stack
# Services: Caddy TLS edge, API, UI, PostgreSQL, Prometheus, Grafana.
# The app auto-selects PostgreSQL when NASWATCH_DB_URL is set, otherwise it
# persists to SQLite (./data volume). All external traffic enters HTTPS via
# Caddy (ports 80/443); API and UI are internal-only.
# Usage: docker-compose -f docker-compose.prod.yml up -d --build
#        docker-compose -f docker-compose.prod.yml logs -f caddy

version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    container_name: naswatch-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NASWATCH_FQDN=${NASWATCH_FQDN:-localhost}
      - NASWATCH_TLS_MODE=${NASWATCH_TLS_MODE:-internal}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - naswatch-api
      - naswatch-ui
    networks:
      - naswatch_net

  naswatch-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naswatch-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - NASWATCH_DB_URL=${NASWATCH_DB_URL:-postgresql://naswatch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/naswatch}
      - NASWATCH_DB_PATH=/app/data/inventory.db
      - NASWATCH_JWT_SECRET=${NASWATCH_JWT_SECRET:?Set NASWATCH_JWT_SECRET in .env}
      - NASWATCH_LICENSE_KEY=${NASWATCH_LICENSE_KEY:-}
      - NASWATCH_ADMIN_EMAIL=${NASWATCH_ADMIN_EMAIL:-admin@naswatch.io}
      - NASWATCH_ADMIN_PASSWORD=${NASWATCH_ADMIN_PASSWORD:?Set NASWATCH_ADMIN_PASSWORD in .env}
      - NASWATCH_FLOOD_THRESHOLD=${NASWATCH_FLOOD_THRESHOLD:-10}
      - NASWATCH_FLOOD_WINDOW_SECONDS=${NASWATCH_FLOOD_WINDOW_SECONDS:-60}
      - NASWATCH_CORS_ORIGINS=${NASWATCH_CORS_ORIGINS:-https://${NASWATCH_FQDN:-localhost}}
      - PAGERDUTY_INTEGRATION_KEY=${PAGERDUTY_INTEGRATION_KEY:-}
      - SPLUNK_HEC_URL=${SPLUNK_HEC_URL:-}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:-}
      - SENTINEL_WORKSPACE_ID=${SENTINEL_WORKSPACE_ID:-}
      - SENTINEL_SHARED_KEY=${SENTINEL_SHARED_KEY:-}
    volumes:
      - ./data:/app/data
    # Single worker by default: SQLite allows one writer. Scale up with
    # NASWATCH_WORKERS > 1 ONLY when NASWATCH_DB_URL points at PostgreSQL.
    command: uvicorn naswatch.api.server:app --host 0.0.0.0 --port 8000 --workers ${NASWATCH_WORKERS:-1}
    depends_on:
      - db
    networks:
      - naswatch_net

  db:
    image: postgres:16-alpine
    container_name: naswatch-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=naswatch
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=naswatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naswatch -d naswatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - naswatch_net

  naswatch-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naswatch-ui
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      - NASWATCH_API_URL=https://${NASWATCH_FQDN:-localhost}/api
      - NASWATCH_JWT_SECRET=${NASWATCH_JWT_SECRET:?Set NASWATCH_JWT_SECRET in .env}
    depends_on:
      - naswatch-api
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0
    networks:
      - naswatch_net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: naswatch-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    networks:
      - naswatch_net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: naswatch-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - naswatch_net

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  naswatch_net:
    driver: bridge