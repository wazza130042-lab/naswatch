[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naswatch"
version = "0.1.0"
description = "Passive 5G control-plane IDS for rogue eSIM, identity spoofing, and network-slice intrusion detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NASWatch Security Engineering Team"}
]
keywords = ["5g", "ids", "security", "ngap", "nas", "network-slicing", "esim", "imsi-catcher"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    # Core protocol dissection & capture
    "pyshark>=0.6.0",
    "scapy>=2.5.0",
    # Dashboard & visualization
    "streamlit>=1.32.0",
    "pandas>=2.1.0",
    "plotly>=5.18.0",
    # Configuration
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    # Enterprise API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    # QR codes for authenticator-app 2FA enrollment (pure Python)
    "segno>=1.6.1",
    # Rate limiting
    "slowapi>=0.1.9",
    # Metrics
    "prometheus-client>=0.20.0",
    # HTTP client (retry-capable SIEM integrations)
    "httpx>=0.27.0",
    # Async PostgreSQL (optional — falls back to SQLite)
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    # Correlation & analytics
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-anyio>=0.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
naswatch = "scripts.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
